[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trafilatura-local"
version = "0.2.0"
description = "Local web content extraction service using Trafilatura"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
py-modules = ["server", "extraction", "web_fetch"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
trafilatura-server = "server:main"

[tool.ruff]
line-length = 200

[tool.ruff.lint]
# pycodestyle errors + pyflakes: the sane minimum, matching the existing style.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

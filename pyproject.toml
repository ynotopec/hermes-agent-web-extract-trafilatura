[project]
name = "trafilatura-local"
version = "0.1.0"
description = "Local web content extraction service using Trafilatura"
requires-python = ">=3.10"
dependencies = [
    "trafilatura",
    "cchardet",
    "certifi",
    "requests",
    "fastapi",
    "uvicorn",
    "httpx",
]

[project.scripts]
trafilatura-server = "trafilatura_local.server:main"

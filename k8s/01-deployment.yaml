apiVersion: apps/v1
kind: Deployment
metadata:
  name: trafilatura-service
  namespace: demo1
  labels:
    app: trafilatura
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: trafilatura
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: trafilatura
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: deps
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - pip install --no-cache-dir --target /deps -r /app/requirements.lock
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: deps
              mountPath: /deps
      containers:
        - name: trafilatura
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "server.py"]
          workingDir: /app
          env:
            - name: PYTHONPATH
              value: /deps
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8990"
            - name: MAX_CHARS
              value: "200000"
            - name: CONCURRENCY
              value: "4"
          ports:
            - containerPort: 8990
              name: http
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: 8990
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8990
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8990
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: deps
              mountPath: /deps
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: code
          configMap:
            name: trafilatura-server
        - name: deps
          emptyDir: {}
        - name: tmp
          emptyDir: {}
